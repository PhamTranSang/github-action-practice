name: Step Types

on: 
  workflow_dispatch:

jobs:
  hello_inline_bash:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World!"

  hello-inline-python:
    runs-on: ubuntu-latest
    steps:
      - run: print("Hello World!")
        shell: python

  hello-action:
    runs-on: ubuntu-latest
    steps:
      - name: Greet with a JavaScript action
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: World
